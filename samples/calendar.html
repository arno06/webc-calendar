<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar</title>
    <script src="../src/webc-calendar.js"></script>
    <style>
        html,body{width:100%;height:100%;padding:0;margin:0;font-family: sans-serif;}
        body{display:flex;flex-direction: column;position:relative;}
        body header, body footer{flex:0 0 auto;}
        body .container{display:flex;flex:1;}
        body .container .secondary{flex:0;margin-right:1em;padding:1em;}
        body .container .main{flex:1;}
        webc-calendar{box-shadow: none;}
        .overlay{z-index:99;background:rgba(0, 0, 0, 0);position:absolute;left:0;top:0;width:100%;height:100%;opacity:1;transition:all .3s;display:flex;align-items: center;justify-content: center;}
        .overlay.hidden{pointer-events: none;opacity: 0;}
        .overlay .modal{gap:1em;border-radius:1em;padding:1em;width:400px;background:#fff;box-shadow: 0 2px 4px rgba(0, 0, 0, .3);transition: all .3s;}
        .overlay .modal .event{display:flex;gap:1em;align-items: start;}
        .overlay .modal .event .infos{flex: 1 1 auto;}
        .overlay .modal .event .actions{display:flex;flex: 0 0 auto;gap:0.5em;align-items: center;}
        .overlay .modal .event .actions span{cursor:pointer;}
        .overlay.hidden .modal{transform:translateY(50px);}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
<div class="container">
    <div class="secondary">
        <h1>Calendar</h1>
        <webc-calendar class="shrinked"></webc-calendar>
    </div>
    <div class="main">
        <webc-calendar display="week" class="expanded"></webc-calendar>
    </div>
</div>
<footer>

</footer>
<div class="overlay hidden">
    <div class="modal">
        <div class="event">
            <div class="infos">
                <div><span>🕰️</span><span class="date"></span></div>
                <div><span>✌️</span><span class="title"></span></div>
                <div><span>🐤</span><span class="subtitle"></span></div>
            </div>
            <div class="actions">
                <span>edit</span>
                <span class="delete">supp</span>
                <span class="close">&times;</span>
            </div>
        </div>
    </div>
</div>
<script>
    let sec = document.querySelector('.container .secondary webc-calendar');
    let main = document.querySelector('.container .main webc-calendar');

    let selectedEvent = null;
    document.querySelectorAll('.overlay, .overlay .modal .close').forEach((pElement)=>{
        pElement.addEventListener('click', (e)=>{
            console.log(e.currentTarget, pElement);
            if(e.currentTarget.classList.contains("overlay") && e.currentTarget !== e.target){
                return;
            }
            document.querySelector('.overlay').classList.add("hidden");
            main.deselectEvent();
        });
    });
    document.querySelector('.overlay .modal .delete').addEventListener('click', (e)=>{
        if(!selectedEvent){
            return;
        }
        console.log(selectedEvent);
        events = events.filter((pEvent)=>{
            return pEvent.date !== selectedEvent.date || pEvent.startAt !== selectedEvent.startAt || pEvent.duration !== selectedEvent.duration || pEvent.title !== selectedEvent.title;
        });
        main.setAttribute("events", JSON.stringify(events));
        document.querySelector('.overlay').classList.add("hidden");
    });

    let events = [
        {'date':'2026-06-30','startAt':'10:00','duration':60,'title':'Atelier d\'estimations - HCP','style':'background:#88AB75;color:white;font-size:0.7em;'},
        {'date':'2026-06-30','startAt':'10:00','duration':60,'title':'Atelier d\'estimations - Mobile','style':'background:#DBD56E;color:white;font-size:0.7em;'},
        {
            'frequency':{
                'weeks':'every week',
                'days':'4'
            },
            'date':'2026-06-30',
            'startAt':'14:00',
            'duration':60,
            'title':'Atelier d\'estimations - Idomed',
            'meta':{subtitle:'14:00 - 15:00', description:''},
            'style':'background:#DBD56E;color:white;font-size:0.7em;'
        },
        {
            'date':'2026-06-30',
            'startAt':'15:00',
            'duration':60,
            'title':'Atelier d\'estimations - Stéphane',
            'style':'background:#2D93AD;color:white;font-size:0.7em;'
        },
        {
            'date':'2026-06-30',
            'startAt':'14:00',
            'duration':60,
            'title':'Atelier d\'estimations - VXL',
            'style':'background:#2D93AD;color:white;font-size:0.7em;'
        },
        {
            'date':'2026-06-30',
            'startAt':'11:00',
            'duration':60,
            'title':'Atelier d\'estimations - Pharma',
            'style':'background:#2D93AD;color:white;font-size:0.7em;'
        },
        {
            'date':'2026-06-30',
            'startAt':'16:00',
            'duration':30,
            'title':'Préparation de démo - Mobile',
            'style':'background:#DBD56E;color:white;font-size:0.7em;'
        },
        {
            'date':'2026-06-30',
            'startAt':'16:30',
            'duration':30,
            'title':'Préparation de démo - HCP',
            'style':'background:#88AB75;color:white;font-size:0.7em;'
        },
        {
            'date':'2026-06-30',
            'startAt':'17:00',
            'duration':30,
            'title':'Préparation de démo - Web',
            'style':'background:#2D93AD;color:white;font-size:0.7em;'
        },
        {
            'date':'2023-03-10',
            'startAt':'10:00',
            'duration':120,
            'title':'Démo Digital',
            'style':'background:#DE8F6E;color:white;font-size:0.7em;'
        },
        {
            'date':'2024-06-05',
            'startAt':'14:00',
            'duration':90,
            'title':'Hebdo Digital',
            'style':'background:#66CED6;color:white;font-size:0.7em;'
        }
    ];

    main.setAttribute("events", JSON.stringify(events));
    sec.addEventListener(WebCCalendar.EVENT_DAY_SELECTED, function(pEvent){
        main.setAttribute("current-date", pEvent.detail.value);
    });
    main.addEventListener(WebCCalendar.EVENT_DATE_CHANGED, function(pEvent){
        sec.setAttribute('selected-dates', pEvent.detail.formattedCurrentDate);
    });
    main.addEventListener(WebCCalendar.EVENT_CREATE_EVENT, function(pEvent){
        pEvent.detail.event.title = "Nouvel évènement";
        pEvent.detail.event.style = "background:#66CED6;color:white;font-size:.7em";
        events.push(pEvent.detail.event);
        main.setAttribute("events", JSON.stringify(events));
    });
    main.addEventListener(WebCCalendar.EVENT_EVENT_SELECTED, function(e){
        selectedEvent = e.detail;
        let d = new Date(e.detail.date+' '+e.detail.startAt);
        const options = {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
        };
        document.querySelector('.overlay .modal .date').innerHTML = d.toLocaleDateString('fr-FR', options)+" "+d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        document.querySelector('.overlay .modal .title').innerHTML = e.detail.title;
        document.querySelector('.overlay .modal .subtitle').innerHTML = e.detail.meta&&e.detail.meta.subtitle?e.detail.meta.subtitle:'';
        document.querySelector('.overlay.hidden').classList.remove("hidden");
    });
</script>
</body>
</html>
